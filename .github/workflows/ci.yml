name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Commit formatted Rust sources
        run: |
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: apply rustfmt formatting"
            git push origin HEAD:main
          fi
      - name: Run tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            linker: aarch64-linux-android21-clang
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            linker_env: CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
            linker: armv7a-linux-androideabi21-clang
          - abi: x86_64
            rust_target: x86_64-linux-android
            linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            linker: x86_64-linux-android21-clang
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust Android target
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;27.2.12479018
      - name: Configure Android linker
        run: |
          NDK_TOOLCHAIN="${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${{ matrix.linker_env }}=${NDK_TOOLCHAIN}/${{ matrix.linker }}" >> "$GITHUB_ENV"
      - name: Build standalone executable
        run: cargo build --target "${{ matrix.rust_target }}" --release
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mysh-${{ matrix.abi }}
          path: target/${{ matrix.rust_target }}/release/mysh
          if-no-files-found: error
