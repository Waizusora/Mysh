name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build MYPK for host
        run: cargo build -p my-pkg-keeper --release

  android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            linker: aarch64-linux-android21-clang
          - abi: x86_64
            rust_target: x86_64-linux-android
            linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            linker: x86_64-linux-android21-clang
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust Android target
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - name: Install Android NDK
        run: android sdk install ndk@27.2.12479018
      - name: Configure Android linker
        run: |
          NDK_TOOLCHAIN="${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET_UNDERSCORE="$(echo "${{ matrix.rust_target }}" | tr '-' '_')"
          echo "${{ matrix.linker_env }}=${NDK_TOOLCHAIN}/${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CC_${TARGET_UNDERSCORE}=${NDK_TOOLCHAIN}/${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CXX_${TARGET_UNDERSCORE}=${NDK_TOOLCHAIN}/${{ matrix.linker }}++" >> "$GITHUB_ENV"
          echo "AR_${TARGET_UNDERSCORE}=${NDK_TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"
      - name: Check out uutils Coreutils
        uses: actions/checkout@v6
        with:
          repository: uutils/coreutils
          ref: dc1efd89948a9ca4c78c3a4b9a6ac891019a8c69
          path: .build/uutils-coreutils
      - name: Patch uutils Android uptime type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".build/uutils-coreutils/src/uu/uptime/src/platform/unix.rs")
          old = "print_uptime(Some(upsecs))?;"
          new = "print_uptime(Some(upsecs as uucore::libc::time_t))?;"
          source = path.read_text()
          if source.count(old) != 1:
              raise SystemExit(f"unexpected uutils source in {path}; refusing compatibility patch")
          path.write_text(source.replace(old, new))
          PY
      - name: Build uutils Coreutils
        run: cargo build --manifest-path .build/uutils-coreutils/Cargo.toml --target "${{ matrix.rust_target }}" --release --no-default-features --features feat_common_core,df,du,env,kill,nohup,nproc,more,sync,tac,timeout,uptime,whoami,feat_require_unix_core
      - name: Build Mysh executable
        run: cargo build -p mysh --target "${{ matrix.rust_target }}" --release
      - name: Build MYPK executable
        run: cargo build -p my-pkg-keeper --target "${{ matrix.rust_target }}" --release
      - name: Upload Mysh executable
        uses: actions/upload-artifact@v6
        with:
          name: mysh-${{ matrix.abi }}
          path: target/${{ matrix.rust_target }}/release/mysh
          if-no-files-found: error
      - name: Upload uutils Coreutils executable
        uses: actions/upload-artifact@v6
        with:
          name: uutils-coreutils-${{ matrix.abi }}
          path: .build/uutils-coreutils/target/${{ matrix.rust_target }}/release/coreutils
          if-no-files-found: error
      - name: Upload MYPK executable
        uses: actions/upload-artifact@v6
        with:
          name: mypk-${{ matrix.abi }}
          path: target/${{ matrix.rust_target }}/release/mypk
          if-no-files-found: error
