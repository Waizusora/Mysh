name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run tests with the C locale
        env:
          LC_ALL: C
        run: cargo test --workspace --all-targets -- --test-threads=1
      - name: Run tests with the UTF-8 locale
        env:
          LC_ALL: C.UTF-8
        run: cargo test --workspace --all-targets -- --test-threads=1
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build MYPK for host
        run: cargo build -p my-pkg-keeper --release

  android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            linker: aarch64-linux-android21-clang
          - abi: x86_64
            rust_target: x86_64-linux-android
            linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            linker: x86_64-linux-android21-clang
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust Android target
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: ndk;27.2.12479018
      - name: Configure Android linker
        run: |
          NDK_TOOLCHAIN="${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET_UNDERSCORE="$(echo "${{ matrix.rust_target }}" | tr '-' '_')"
          echo "${{ matrix.linker_env }}=${NDK_TOOLCHAIN}/${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CC_${TARGET_UNDERSCORE}=${NDK_TOOLCHAIN}/${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CXX_${TARGET_UNDERSCORE}=${NDK_TOOLCHAIN}/${{ matrix.linker }}++" >> "$GITHUB_ENV"
          echo "AR_${TARGET_UNDERSCORE}=${NDK_TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"
      - name: Check out uutils Coreutils
        uses: actions/checkout@v6
        with:
          repository: uutils/coreutils
          ref: dc1efd89948a9ca4c78c3a4b9a6ac891019a8c69
          path: .build/uutils-coreutils
      - name: Patch uutils Android uptime type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".build/uutils-coreutils/src/uu/uptime/src/platform/unix.rs")
          old = "print_uptime(Some(upsecs))?;"
          new = "print_uptime(Some(upsecs as uucore::libc::time_t))?;"
          source = path.read_text()
          if source.count(old) != 1:
              raise SystemExit(f"unexpected uutils source in {path}; refusing compatibility patch")
          path.write_text(source.replace(old, new))
          PY
      - name: Build uutils Coreutils
        run: cargo build --manifest-path .build/uutils-coreutils/Cargo.toml --target "${{ matrix.rust_target }}" --release --no-default-features --features feat_common_core,df,du,env,kill,nohup,nproc,more,sync,tac,timeout,uptime,whoami,feat_require_unix_core
      - name: Build Mysh executable
        run: cargo build -p mysh --target "${{ matrix.rust_target }}" --release
      - name: Smoke-test Mysh against Android Bionic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb push target/${{ matrix.rust_target }}/release/mysh /data/local/tmp/mysh
            adb shell chmod 755 /data/local/tmp/mysh
            adb shell mkdir -p /data/local/tmp/mysh-glob
            adb shell touch /data/local/tmp/mysh-glob/alpha.txt
            output="$(adb shell "/data/local/tmp/mysh -c 'X=4; echo \$((X++)) \$X; echo \${MYSH_EMULATOR_MISSING:-left \${MYSH_EMULATOR_INNER:-middle value} right}'" | tr -d '\r')"
            expected="$(printf '4 5\nleft middle value right')"
            test "$output" = "$expected"
            adb shell ls -la /data/local/tmp/mysh-glob
            glob="$(adb shell "/data/local/tmp/mysh -c 'echo /data/local/tmp/mysh-glob/*.txt'" | tr -d '\r')"
            printf 'Bionic pathname expansion output: <%s>\\n' "$glob"
            test "$glob" = "/data/local/tmp/mysh-glob/alpha.txt"
            class_glob="$(adb shell "/data/local/tmp/mysh -c 'echo /data/local/tmp/mysh-glob/[[:alpha:]]*.txt'" | tr -d '\r')"
            printf 'Bionic locale-class pathname expansion output: <%s>\\n' "$class_glob"
            test "$class_glob" = "/data/local/tmp/mysh-glob/alpha.txt"
      - name: Build MYPK executable
        run: cargo build -p my-pkg-keeper --target "${{ matrix.rust_target }}" --release
      - name: Package Android runtime
        run: bash scripts/package-android-runtime.sh "${{ matrix.abi }}"
      - name: Upload Android runtime package
        uses: actions/upload-artifact@v6
        with:
          name: mysh-runtime-${{ matrix.abi }}
          path: dist/mysh-runtime-${{ matrix.abi }}.tar.gz
          if-no-files-found: error
      - name: Upload Mysh executable
        uses: actions/upload-artifact@v6
        with:
          name: mysh-${{ matrix.abi }}
          path: target/${{ matrix.rust_target }}/release/mysh
          if-no-files-found: error
      - name: Upload uutils Coreutils executable
        uses: actions/upload-artifact@v6
        with:
          name: uutils-coreutils-${{ matrix.abi }}
          path: .build/uutils-coreutils/target/${{ matrix.rust_target }}/release/coreutils
          if-no-files-found: error
      - name: Upload MYPK executable
        uses: actions/upload-artifact@v6
        with:
          name: mypk-${{ matrix.abi }}
          path: target/${{ matrix.rust_target }}/release/mypk
          if-no-files-found: error
  musl:
    name: Build Linux musl (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-musl
          - arch: aarch64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install native x86_64 musl linker
        if: matrix.arch == 'x86_64'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Configure native x86_64 musl linker
        if: matrix.arch == 'x86_64'
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Install cross
        if: matrix.arch == 'aarch64'
        uses: taiki-e/install-action@cross
      - name: Build Mysh for musl
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            cross build -p mysh --target "${{ matrix.rust_target }}" --release
          else
            cargo build -p mysh --target "${{ matrix.rust_target }}" --release
          fi
      - name: Register ARM64 binfmt handler for nested test processes
        if: matrix.arch == 'aarch64'
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          test -r /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -q enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Run Mysh tests on musl
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            cross test -p mysh --target "${{ matrix.rust_target }}" --release -- --test-threads=1
          else
            cargo test -p mysh --target "${{ matrix.rust_target }}" --release -- --test-threads=1
          fi
      - name: Build MYPK for musl
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            cross build -p my-pkg-keeper --target "${{ matrix.rust_target }}" --release
          else
            cargo build -p my-pkg-keeper --target "${{ matrix.rust_target }}" --release
          fi
      - name: Upload Mysh musl executable
        uses: actions/upload-artifact@v6
        with:
          name: mysh-musl-${{ matrix.arch }}
          path: target/${{ matrix.rust_target }}/release/mysh
          if-no-files-found: error
      - name: Upload MYPK musl executable
        uses: actions/upload-artifact@v6
        with:
          name: mypk-musl-${{ matrix.arch }}
          path: target/${{ matrix.rust_target }}/release/mypk
          if-no-files-found: error
