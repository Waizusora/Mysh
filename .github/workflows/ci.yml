name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run tests with the C locale
        env:
          LC_ALL: C
        run: cargo test --workspace --all-targets -- --test-threads=1
      - name: Run tests with the UTF-8 locale
        env:
          LC_ALL: C.UTF-8
        run: cargo test --workspace --all-targets -- --test-threads=1
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Build both Android ABIs on x86_64 so the Linux x86_64 NDK host tools
      # are executable. API 35 x86_64 Google APIs images provide ARM ABI
      # translation for the arm64-v8a runtime smoke test.
      # Serialize emulator boots to avoid resource contention.
      max-parallel: 1
      matrix:
        include:
          - abi: arm64-v8a
            runner: ubuntu-24.04
            rust_target: aarch64-linux-android
            emulator_arch: x86_64
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            linker: aarch64-linux-android21-clang
          - abi: x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-linux-android
            emulator_arch: x86_64
            linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            linker: x86_64-linux-android21-clang
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust Android target
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: ndk;27.2.12479018
      - name: Configure Android linker
        run: |
          NDK_TOOLCHAIN="${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET_UNDERSCORE="$(echo "${{ matrix.rust_target }}" | tr '-' '_')"
          echo "${{ matrix.linker_env }}=${NDK_TOOLCHAIN}/${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CC_${TARGET_UNDERSCORE}=${NDK_TOOLCHAIN}/${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CXX_${TARGET_UNDERSCORE}=${NDK_TOOLCHAIN}/${{ matrix.linker }}++" >> "$GITHUB_ENV"
          echo "AR_${TARGET_UNDERSCORE}=${NDK_TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"
      - name: Check out uutils Coreutils
        uses: actions/checkout@v6
        with:
          repository: uutils/coreutils
          ref: dc1efd89948a9ca4c78c3a4b9a6ac891019a8c69
          path: .build/uutils-coreutils
      - name: Patch uutils Android uptime type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".build/uutils-coreutils/src/uu/uptime/src/platform/unix.rs")
          old = "print_uptime(Some(upsecs))?;"
          new = "print_uptime(Some(upsecs as uucore::libc::time_t))?;"
          source = path.read_text()
          if source.count(old) != 1:
              raise SystemExit(f"unexpected uutils source in {path}; refusing compatibility patch")
          path.write_text(source.replace(old, new))
          PY
      - name: Build uutils Coreutils
        run: cargo build --manifest-path .build/uutils-coreutils/Cargo.toml --target "${{ matrix.rust_target }}" --release --no-default-features --features feat_common_core,df,du,env,kill,nohup,nproc,more,sync,tac,timeout,uptime,whoami,feat_require_unix_core
      - name: Build Mysh executable
        run: cargo build -p mysh --target "${{ matrix.rust_target }}" --release
      - name: Stage platform-qualified Android binaries
        run: |
          mkdir -p dist
          cp "target/${{ matrix.rust_target }}/release/mysh" "dist/mysh-android-bionic-${{ matrix.abi }}"
      # Cache both the AVD state and its system image. The cache is immutable;
      # bump the key suffix when the emulator configuration changes.
      - name: Restore Android emulator AVD and system image cache
        id: android-avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: android-avd-ubuntu-24.04-api35-google-apis-x86_64-pixel5-v1
      - name: Install Android emulator system image
        run: |
          sdkmanager --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
      - name: Enable KVM acceleration for Android emulator
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Create and boot Android emulator
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${HOME}/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          if [ ! -s "${ANDROID_AVD_HOME}/mysh-ci-api35.ini" ]; then
            echo "AVD cache miss; creating mysh-ci-api35."
            echo "no" | avdmanager create avd --force \
              --name mysh-ci-api35 \
              --package "system-images;android-35;google_apis;x86_64" \
              --device "pixel_5"
          else
            echo "Restored cached AVD configuration:"
            ls -la "$ANDROID_AVD_HOME"
          fi
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "$GITHUB_ENV"
          test -s "${ANDROID_AVD_HOME}/mysh-ci-api35.ini"
          EMULATOR_BIN="${ANDROID_HOME}/emulator/emulator"
          if [ ! -x "$EMULATOR_BIN" ]; then
            echo "Android emulator binary is missing: $EMULATOR_BIN"
            find "$ANDROID_HOME" -maxdepth 3 -type f -name emulator -print || true
            exit 1
          fi
          "$EMULATOR_BIN" -avd mysh-ci-api35 \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-metrics -camera-back none -camera-front none \
            -cores 4 -memory 4096 \
            > "$RUNNER_TEMP/mysh-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mysh-emulator.pid"
          adb start-server
          # Do not use adb wait-for-device here: it has no timeout and can
          # leave the Actions job hanging forever when the emulator never
          # registers with the ADB server.
          device_deadline=$((SECONDS + 180))
          until adb devices | awk '$1 == "emulator-5554" && $2 == "device" { found=1 } END { exit !found }'; do
            if ! kill -0 "$(cat "$RUNNER_TEMP/mysh-emulator.pid")" 2>/dev/null; then
              echo "Android emulator process exited before becoming available to ADB."
              tail -n 200 "$RUNNER_TEMP/mysh-emulator.log" || true
              adb devices -l || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$device_deadline" ]; then
              echo "Android emulator did not register with ADB within 180 seconds."
              adb devices -l || true
              tail -n 200 "$RUNNER_TEMP/mysh-emulator.log" || true
              exit 1
            fi
            sleep 5
          done
          boot_deadline=$((SECONDS + 900))
          until [ "$(timeout 15s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if ! kill -0 "$(cat "$RUNNER_TEMP/mysh-emulator.pid")" 2>/dev/null; then
              echo "Android emulator process exited during boot."
              tail -n 200 "$RUNNER_TEMP/mysh-emulator.log" || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$boot_deadline" ]; then
              echo "Android emulator did not finish booting within 900 seconds."
              adb -s emulator-5554 get-state || true
              tail -n 200 "$RUNNER_TEMP/mysh-emulator.log" || true
              exit 1
            fi
            sleep 5
          done
          # Confirm the framework services are responding before running tests.
          adb -s emulator-5554 shell id
          adb -s emulator-5554 shell pm path android
          adb -s emulator-5554 shell getprop ro.product.cpu.abilist
      - name: Smoke-test Mysh against Android Bionic
        run: |
          set -euo pipefail
          cleanup() {
            # A graceful emulator shutdown writes the Quick Boot snapshot.
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            if [ -f "$RUNNER_TEMP/mysh-emulator.pid" ]; then
              emulator_pid="$(cat "$RUNNER_TEMP/mysh-emulator.pid")"
              shutdown_deadline=$((SECONDS + 60))
              while kill -0 "$emulator_pid" 2>/dev/null && [ "$SECONDS" -lt "$shutdown_deadline" ]; do
                sleep 2
              done
              if kill -0 "$emulator_pid" 2>/dev/null; then
                echo "Emulator did not stop gracefully; terminating it."
                kill "$emulator_pid" >/dev/null 2>&1 || true
              fi
            fi
          }
          trap cleanup EXIT
          trap 'status=$?; echo "Smoke test failed with status $status; collecting Android crash diagnostics."; adb logcat -d -b crash -t 300 || true; adb logcat -d -t 1500 | grep -E -i "mysh|tombstone|signal 11|SIGSEGV|fatal signal|libc.*crash" | tail -n 200 || true; adb shell ls -lt /data/tombstones 2>&1 || true; exit "$status"' ERR
          adb shell mkdir -p /data/local/tmp/mysh-prefix/bin /data/local/tmp/mysh-glob
          adb push target/${{ matrix.rust_target }}/release/mysh /data/local/tmp/mysh
          # The x86_64 emulator's ARM64 translation layer currently crashes
          # when executing the ARM64 uutils binary (SIGSEGV in the translated
          # coreutils process). Keep ARM64 artifact build/package checks, but
          # use the emulator's native Toybox utilities for this smoke test.
          if [ "${{ matrix.abi }}" = "x86_64" ]; then
            adb push .build/uutils-coreutils/target/${{ matrix.rust_target }}/release/coreutils /data/local/tmp/mysh-prefix/bin/coreutils
            adb shell chmod 755 /data/local/tmp/mysh-prefix/bin/coreutils
          fi
          adb shell chmod 755 /data/local/tmp/mysh
          platform="$(adb shell /data/local/tmp/mysh --platform | tr -d '\r')"
          hostname="$(adb shell hostname | tr -d '\r')"
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            expected_arch="aarch64"
          else
            expected_arch="x86_64"
          fi
          expected_platform="${hostname}-bionic-${expected_arch}"
          printf 'Android runtime platform: <%s>\n' "$platform"
          test "$platform" = "$expected_platform"
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            # The x86_64 Android image executes ARM64 guests through
            # ndk_translation. uutils/coreutils currently SIGSEGVs in that
            # translation layer, independently of Mysh. Validate that the
            # ARM64 Mysh binary starts on Bionic and executes shell builtins
            # without depending on translated external ARM64 programs.
            adb shell "MYSH_PREFIX=/data/local/tmp/mysh-prefix /data/local/tmp/mysh -c 'cd /data/local/tmp; X=4; X=5; exit 0'"
          else
            adb shell touch /data/local/tmp/mysh-glob/alpha.txt
            output="$(adb shell "MYSH_PREFIX=/data/local/tmp/mysh-prefix /data/local/tmp/mysh -c 'X=4; echo \$((X++)) \$X; echo \${MYSH_EMULATOR_MISSING:-left \${MYSH_EMULATOR_INNER:-middle value} right}'" | tr -d '\r')"
            expected="$(printf '4 5\nleft middle value right')"
            test "$output" = "$expected"
            adb shell ls -la /data/local/tmp/mysh-glob
            literal_status=0
            literal="$(adb shell "MYSH_PREFIX=/data/local/tmp/mysh-prefix /data/local/tmp/mysh -c 'echo literal-ok'" 2>&1 | tr -d '\r')" || literal_status=$?
            printf 'Bionic literal echo status=%s output: <%s>\\n' "$literal_status" "$literal"
            test "$literal_status" -eq 0
            test "$literal" = "literal-ok"
            exact="$(adb shell "MYSH_PREFIX=/data/local/tmp/mysh-prefix /data/local/tmp/mysh -c 'echo /data/local/tmp/mysh-glob/alpha.txt'" | tr -d '\r')"
            printf 'Bionic exact-path output: <%s>\\n' "$exact"
            test "$exact" = "/data/local/tmp/mysh-glob/alpha.txt"
            if glob="$(adb shell "MYSH_PREFIX=/data/local/tmp/mysh-prefix /data/local/tmp/mysh -c 'echo /data/local/tmp/mysh-glob/*.txt'" | tr -d '\r')"; then
              glob_status=0
            else
              glob_status=$?
            fi
            printf 'Bionic pathname expansion status=%s output: <%s>\\n' "$glob_status" "$glob"
            test "$glob" = "/data/local/tmp/mysh-glob/alpha.txt"
            class_glob="$(adb shell "MYSH_PREFIX=/data/local/tmp/mysh-prefix /data/local/tmp/mysh -c 'echo /data/local/tmp/mysh-glob/[[:alpha:]]*.txt'" | tr -d '\r')"
            printf 'Bionic locale-class pathname expansion output: <%s>\\n' "$class_glob"
            test "$class_glob" = "/data/local/tmp/mysh-glob/alpha.txt"
          fi
      - name: Package Android runtime
        run: bash scripts/package-android-runtime.sh "${{ matrix.abi }}"
      - name: Upload Android runtime package
        uses: actions/upload-artifact@v6
        with:
          name: mysh-android-bionic-${{ matrix.abi }}-runtime
          path: dist/mysh-android-bionic-${{ matrix.abi }}-runtime.tar.gz
          if-no-files-found: error
      - name: Upload Mysh executable
        uses: actions/upload-artifact@v6
        with:
          name: mysh-android-bionic-${{ matrix.abi }}
          path: dist/mysh-android-bionic-${{ matrix.abi }}
          if-no-files-found: error
      - name: Upload uutils Coreutils executable
        uses: actions/upload-artifact@v6
        with:
          name: coreutils-android-bionic-${{ matrix.abi }}
          path: .build/uutils-coreutils/target/${{ matrix.rust_target }}/release/coreutils
          if-no-files-found: error
  musl:
    name: Build Linux musl (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-musl
          - arch: aarch64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install native x86_64 musl linker
        if: matrix.arch == 'x86_64'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Configure native x86_64 musl linker
        if: matrix.arch == 'x86_64'
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Install cross
        if: matrix.arch == 'aarch64'
        uses: taiki-e/install-action@cross
      - name: Build Mysh for musl
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            cross build -p mysh --target "${{ matrix.rust_target }}" --release
          else
            cargo build -p mysh --target "${{ matrix.rust_target }}" --release
          fi
      - name: Register ARM64 binfmt handler for nested test processes
        if: matrix.arch == 'aarch64'
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          test -r /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -q enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Run Mysh tests on musl
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            cross test -p mysh --target "${{ matrix.rust_target }}" --release -- --test-threads=1
          else
            cargo test -p mysh --target "${{ matrix.rust_target }}" --release -- --test-threads=1
          fi
      - name: Stage platform-qualified Linux binaries
        run: |
          mkdir -p dist
          cp "target/${{ matrix.rust_target }}/release/mysh" "dist/mysh-linux-musl-${{ matrix.arch }}"
      - name: Upload Mysh musl executable
        uses: actions/upload-artifact@v6
        with:
          name: mysh-linux-musl-${{ matrix.arch }}
          path: dist/mysh-linux-musl-${{ matrix.arch }}
          if-no-files-found: error
