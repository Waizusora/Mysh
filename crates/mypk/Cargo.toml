[package]
name = "my-pkg-keeper"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "My Package Keeper, the independent package manager for Mysh"
license = "BSD-3-Clause"
repository = "https://github.com/Waizusora/Mysh"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
tar = "0.4"

[lib]
name = "mypk"
path = "src/lib.rs"

[[bin]]
name = "mypk"
path = "src/main.rs"
